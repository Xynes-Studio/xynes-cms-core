services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./test/support/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
